name: Code Quality Gate

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

jobs:
  quality-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: 1. ESLint 检查
        run: |
          echo "═══════════════════════════════════════"
          echo "  ESLint 全量检查"
          echo "═══════════════════════════════════════"
          pnpm lint

      - name: 2. Prettier 格式检查
        run: |
          echo "═══════════════════════════════════════"
          echo "  Prettier 格式检查"
          echo "═══════════════════════════════════════"
          pnpm format:check

      - name: 3. TypeScript 类型检查
        run: |
          echo "═══════════════════════════════════════"
          echo "  TypeScript 类型检查 (tsc --noEmit)"
          echo "═══════════════════════════════════════"
          pnpm build

      - name: 4. 类型安全数量检查
        run: |
          echo "═══════════════════════════════════════"
          echo "  any/unknown 类型数量限制检查"
          echo "═══════════════════════════════════════"
          bash scripts/check-type-safety.sh

      - name: 5. 单元测试 + 覆盖率
        env:
          NODE_ENV: test
          DB_TYPE: sqlite
          JWT_SECRET: test_secret_key_for_testing_only_do_not_use_in_production
          JWT_EXPIRES_IN: 24h
          ADMIN_PASSWORD: test-admin-password-for-github-ci
        run: |
          echo "═══════════════════════════════════════"
          echo "  单元测试 + 覆盖率"
          echo "═══════════════════════════════════════"
          pnpm vitest run --coverage --config vitest.unit.config.ts

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  feishu-notify:
    name: Feishu Notification
    if: ${{ always() }}
    needs: [quality-check]
    uses: dyyz1993/ci-tools/.github/workflows/feishu-notify.yml@main
    with:
      jobs: '{"quality-check":"${{ needs.quality-check.result }}"}'
      sha: ${{ github.sha }}
      ref: ${{ github.ref_name }}
      actor: ${{ github.actor }}
      repo: ${{ github.repository }}
      run-id: ${{ github.run_id }}
    secrets:
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
