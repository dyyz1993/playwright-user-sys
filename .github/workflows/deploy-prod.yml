name: Deploy Prod

# 一键部署：GitHub Actions 页面 → Deploy Prod → Run workflow
# 跑在极空间 NAS 的 gha-runner-pus 上（label: pus-deploy，容器 gha2-runner-1），
# 通过部署专用密钥 SSH 到宿主机执行 compose 滚动更新。
#
# 两种镜像来源（source）：
# - registry（默认）：SSH 到宿主机 docker pull；ghcr 直连不通时自动降级试国内代理前缀
#   （daocloud / 1ms，仅当 ghcr 包为 Public 时代理才看得见——ghcr 新包默认 Private，
#   需在 GitHub Packages 设置里改 Public，匿名代理和直连匿名拉取才可用）
# - artifact：从 "Docker Build & Test" 的 run 下载镜像 tar 工件，流式 docker load 进宿主机。
#   彻底绕开 ghcr 网络/可见性问题，代价是从 GitHub 拉约 1GB 工件
#
# skip_pull 仅在 source=registry 时生效（artifact 模式本身就是在装镜像）。

on:
  workflow_dispatch:
    inputs:
      source:
        description: '镜像来源'
        type: choice
        options:
          - registry
          - artifact
        default: registry
      image:
        description: 'artifact 模式：加载哪个镜像'
        type: choice
        options:
          - machine
          - manager
        default: machine
      artifact_run_id:
        description: 'artifact 模式：Docker Build & Test 的 run id（留空=取 main 最新成功 run）'
        type: string
        default: ''
      skip_pull:
        description: '[registry 模式] 跳过拉取，直接用 NAS 本地已有镜像'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: pus-deploy
    timeout-minutes: 60
    steps:
      - name: 配置部署密钥
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH_OK=$(ssh -i ~/.ssh/deploy_key -o BatchMode=yes -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}"@"${{ secrets.DEPLOY_HOST }}" 'echo yes')"

      - name: "[registry] 拉取镜像（直连 → 国内代理前缀降级）"
        if: ${{ inputs.source == 'registry' && inputs.skip_pull != true }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}"@"${{ secrets.DEPLOY_HOST }}" '
            cd /data/docker/playwright-user-sys/docker || exit 1
            set -a; . ./.env; set +a
            pull_with_fallback() {
              FULL="$1"
              echo "== try direct: $FULL =="
              timeout 240 docker pull "$FULL" && return 0
              for PFX in docker.m.daocloud.io docker.1ms.run; do
                echo "== try prefix: $PFX/$FULL =="
                if timeout 480 docker pull "$PFX/$FULL"; then
                  docker tag "$PFX/$FULL" "$FULL"
                  echo "retagged $PFX/$FULL -> $FULL"
                  return 0
                fi
              done
              return 1
            }
            # 两个 ghcr 镜像各带一层重试；mysql 属 docker.io，走 daemon registry-mirrors，无需处理
            for i in 1 2; do
              if pull_with_fallback "$DOCKER_REGISTRY:$IMAGE_TAG" && \
                 pull_with_fallback "$DOCKER_REGISTRY_MACHINE:$IMAGE_TAG"; then
                echo "PULL_OK"; exit 0
              fi
              echo "== attempt $i failed, retry in 20s =="
              sleep 20
            done
            echo "::error::registry 模式拉取失败（ghcr 包 Private 时代理也看不见，需改 Public；或改用 source=artifact）。"
            exit 1
          '

      - name: "[artifact] 从 CI 工件加载镜像"
        if: ${{ inputs.source == 'artifact' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="${{ inputs.artifact_run_id }}"
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list -R "${{ github.repository }}" \
              --workflow "Docker Build & Test" --branch main --status success \
              --limit 1 --json databaseId --jq '.[0].databaseId')
            echo "resolved latest successful build run: $RUN_ID"
          fi
          rm -rf art && mkdir art
          # 找到工件 id
          ART_ID=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" \
            --jq ".artifacts[] | select(.name==\"image-${{ inputs.image }}\") | .id")
          [ -n "$ART_ID" ] || { echo "::error::run $RUN_ID 里没有 image-${{ inputs.image }} 工件"; exit 1; }
          echo "artifact id: $ART_ID"
          # GitHub blob 端点直连不通 → 走局域网代理 + curl 断点续传重试
          # （gh run download 无续传，大文件中断即废，已实测吃过亏）
          CURL_ZIP="art/image-${{ inputs.image }}.zip"
          for i in 1 2 3; do
            echo "== curl attempt $i =="
            if https_proxy=http://192.168.0.4:7890 http_proxy=http://192.168.0.4:7890 \
                 curl -fL -C - --retry 8 --retry-delay 10 --retry-all-errors --speed-limit 10240 --speed-time 60 \
                   -H "Authorization: Bearer $GH_TOKEN" \
                   -H "Accept: application/vnd.github+json" \
                   -o "$CURL_ZIP" \
                   "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ART_ID/zip"; then
              break
            fi
            [ "$i" = 3 ] && { echo "::error::工件下载三次未完成"; exit 1; }
            sleep 15
          done
          ls -lh "$CURL_ZIP"
          unzip -o -q "$CURL_ZIP" -d art
          TARBALL=$(ls art/*.tar.gz art/*.tar 2>/dev/null | head -n1)
          [ -n "$TARBALL" ] || { echo "::error::工件里没有 tar"; exit 1; }
          # 流式灌进宿主机 docker（docker load 兼容 gzip 流，不落盘）
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" \
            "${{ secrets.DEPLOY_USER }}"@"${{ secrets.DEPLOY_HOST }}" "docker load" \
            < "$TARBALL"
          echo "ARTIFACT_LOAD_OK"

      - name: 滚动更新容器
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}"@"${{ secrets.DEPLOY_HOST }}" '
            cd /data/docker/playwright-user-sys/docker || exit 1
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
          '

      - name: 健康检查（manager + gRPC 机器数）
        run: |
          sleep 20
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}"@"${{ secrets.DEPLOY_HOST }}" '
            for i in 1 2 3 4 5 6; do
              HEALTH=$(curl -sf http://localhost:3011/health || true)
              if echo "$HEALTH" | grep -q "\"status\":\"ok\""; then
                MACHINES=$(echo "$HEALTH" | grep -o "\"machines\":[0-9]*" | cut -d: -f2)
                echo "health=ok machines=$MACHINES"
                if [ "${MACHINES:-0}" -ge 1 ]; then
                  echo "DEPLOY_HEALTHY"; exit 0
                fi
              fi
              echo "attempt $i: not healthy yet, retry in 10s"
              sleep 10
            done
            echo "::error::部署后健康检查未通过（manager 异常或 gRPC 无机器连接），请查 docker logs playwright-manager-prod"
            exit 1
          '

      - name: 显示当前运行版本
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}"@"${{ secrets.DEPLOY_HOST }}" '
            docker ps --format "{{.Names}}\t{{.Image}}\t{{.Status}}" | grep playwright | sort
          '

  feishu-notify:
    name: Feishu Notification
    needs: [deploy]
    if: ${{ always() }}
    uses: dyyz1993/ci-tools/.github/workflows/feishu-notify.yml@main
    with:
      jobs: '{"deploy":"${{ needs.deploy.result }}"}'
      sha: ${{ github.sha }}
      ref: ${{ github.ref_name }}
      actor: ${{ github.actor }}
      repo: ${{ github.repository }}
      run-id: ${{ github.run_id }}
    secrets: inherit
