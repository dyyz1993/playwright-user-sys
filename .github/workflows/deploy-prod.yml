name: Deploy Prod

# 一键部署：GitHub Actions 页面 → Deploy Prod → Run workflow
# 跑在极空间 NAS 的 gha-runner-pus 上（label: pus-deploy，容器 gha2-runner-1），
# 通过部署专用密钥 SSH 到宿主机执行 compose 滚动更新。
#
# 两种镜像来源（source）：
# - registry（默认）：SSH 到宿主机 docker pull；ghcr 直连不通时自动降级试国内代理前缀
#   （daocloud / 1ms，仅当 ghcr 包为 Public 时代理才看得见——ghcr 新包默认 Private，
#   需在 GitHub Packages 设置里改 Public，匿名代理和直连匿名拉取才可用）
# - artifact：从 "Docker Build & Test" 的 run 下载镜像 tar 工件，流式 docker load 进宿主机。
#   彻底绕开 ghcr 网络/可见性问题，代价是从 GitHub 拉约 1GB 工件
#
# skip_pull 仅在 source=registry 时生效（artifact 模式本身就是在装镜像）。

on:
  workflow_dispatch:
    inputs:
      source:
        description: '镜像来源'
        type: choice
        options:
          - registry
          - artifact
        default: registry
      image:
        description: 'artifact 模式：加载哪个镜像'
        type: choice
        options:
          - machine
          - manager
        default: machine
      artifact_run_id:
        description: 'artifact 模式：Docker Build & Test 的 run id（留空=取 main 最新成功 run）'
        type: string
        default: ''
      skip_pull:
        description: '[registry 模式] 跳过拉取，直接用 NAS 本地已有镜像'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: pus-deploy
    timeout-minutes: 60
    steps:
      - name: 配置部署密钥
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH_OK=$(ssh -i ~/.ssh/deploy_key -o BatchMode=yes -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}"@"${{ secrets.DEPLOY_HOST }}" 'echo yes')"

      - name: "[registry] 拉取镜像（直连 → 国内代理前缀降级）"
        if: ${{ inputs.source == 'registry' && inputs.skip_pull != true }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}"@"${{ secrets.DEPLOY_HOST }}" '
            cd /data/docker/playwright-user-sys/docker || exit 1
            set -a; . ./.env; set +a
            pull_with_fallback() {
              FULL="$1"
              echo "== try direct: $FULL =="
              # 公开包直连可拉但慢（~1-2.5MB/s），层缓存跨轮累积，给足单次窗口
              timeout 1500 docker pull "$FULL" && return 0
              for PFX in docker.m.daocloud.io docker.1ms.run; do
                echo "== try prefix: $PFX/$FULL =="
                if timeout 480 docker pull "$PFX/$FULL"; then
                  docker tag "$PFX/$FULL" "$FULL"
                  echo "retagged $PFX/$FULL -> $FULL"
                  return 0
                fi
              done
              return 1
            }
            # machine（真正变更的镜像）优先，独立重试 3 轮——层缓存跨轮累积，逐轮逼近完成；
            # manager 通常无变更，失败不阻塞（NAS 本地已有可用版本）
            M_OK=0
            for i in 1 2 3; do
              echo "== machine pull round $i =="
              if pull_with_fallback "$DOCKER_REGISTRY_MACHINE:$IMAGE_TAG"; then M_OK=1; break; fi
              sleep 15
            done
            [ "$M_OK" = 1 ] || { echo "::error::machine 镜像 3 轮拉取未完成，层缓存已保留可重跑"; exit 1; }
            for i in 1 2; do
              if pull_with_fallback "$DOCKER_REGISTRY:$IMAGE_TAG"; then break; fi
              echo "== manager pull attempt $i failed (NAS 本地已有可用版本，不阻塞) =="
              sleep 15
            done
            echo "PULL_OK"; exit 0
          '

      - name: "[artifact] 从 CI 工件加载镜像"
        if: ${{ inputs.source == 'artifact' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="${{ inputs.artifact_run_id }}"
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list -R "${{ github.repository }}" \
              --workflow "Docker Build & Test" --branch main --status success \
              --limit 1 --json databaseId --jq '.[0].databaseId')
            echo "resolved latest successful build run: $RUN_ID"
          fi
          rm -rf art && mkdir art
          # 找到工件 id + 大小（zip 端点不支持 HEAD，大小从工件元数据取）
          read -r ART_ID TOTAL <<< "$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" \
            --jq ".artifacts[] | select(.name==\"image-${{ inputs.image }}\") | \"\(.id) \(.size_in_bytes)\"")"
          [ -n "$ART_ID" ] || { echo "::error::run $RUN_ID 里没有 image-${{ inputs.image }} 工件"; exit 1; }
          echo "artifact id: $ART_ID size: $TOTAL"
          # GitHub blob 端点对单连接限速严重（单流 0.1~0.9MB/s），代理节点国际带宽充足
          # （实测 4MB/s）→ 用 8 路并发分段下载绕开单流限速。段文件落在 runner 自属主
          # 持久卷（跨 run 断点续传）；每段按字节数校验，缺失/短小段只补下载
          ART_DIR=/home/runner/.npm/art-partial/$RUN_ID
          mkdir -p "$ART_DIR"
          URL="https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ART_ID/zip"
          # 代理必须 export 进环境：bash 对命令位置的变量展开结果不识别 VAR=value
          # 赋值前缀（把 https_proxy=... 当可执行路径找，秒挂 No such file or
          # directory）——此前多轮"下载失败"实际是这个 shell 错误
          export https_proxy=http://192.168.0.4:7890 http_proxy=http://192.168.0.4:7890
          AUTH="Authorization: Bearer $GH_TOKEN"
          # 串行分段下载（实测：单流 117MB 能稳定跑完，8 路并发会被 blob 端全拒）。
          # 每段独立校验+段内续传+空速看门狗；段文件持久卷跨 run 存活
          N=12
          CHUNK=$(( (TOTAL + N - 1) / N ))
          for round in $(seq 1 30); do
            all_ok=1
            for i in $(seq 0 $((N-1))); do
              S=$((i*CHUNK)); E=$((S+CHUNK-1)); [ $E -ge $TOTAL ] && E=$((TOTAL-1))
              [ $S -gt $E ] && continue
              F="$ART_DIR/part_$(printf %02d $i)"
              WANT=$((E-S+1)); HAVE=0; [ -f "$F" ] && HAVE=$(stat -c%s "$F")
              [ "$HAVE" -eq "$WANT" ] && continue
              all_ok=0
              echo "chunk $i: have=$HAVE want=$WANT (round $round)"
              if [ "$HAVE" -gt 0 ]; then RANGE="$((S+HAVE))-$E"; else RANGE="$S-$E"; fi
              curl -fL --retry 8 --retry-delay 8 --retry-all-errors \
                --speed-limit 65536 --speed-time 30 \
                -H "$AUTH" -r "$RANGE" -o "$F.seg" "$URL" || true
              if [ -s "$F.seg" ]; then
                if [ "$HAVE" -gt 0 ]; then cat "$F" "$F.seg" > "$F.tmp"; else cp "$F.seg" "$F.tmp"; fi
                mv "$F.tmp" "$F"; rm -f "$F.seg"
                HAVE=$(stat -c%s "$F")
                echo "chunk $i: now $HAVE/$WANT"
              fi
            done
            [ "$all_ok" = 1 ] && { echo "all chunks complete after round $round"; break; }
            echo "round $round done, incomplete chunks remain, next round"
          done
          # 30 轮外循环结束仍不齐则报错（每段都有校验，大小对不上会在拼接处再拦）
          ok=1
          for i in $(seq 0 $((N-1))); do
            S=$((i*CHUNK)); E=$((S+CHUNK-1)); [ $E -ge $TOTAL ] && E=$((TOTAL-1))
            [ $S -gt $E ] && continue
            F="$ART_DIR/part_$(printf %02d $i)"; WANT=$((E-S+1)); HAVE=0; [ -f "$F" ] && HAVE=$(stat -c%s "$F")
            [ "$HAVE" -ne "$WANT" ] && { ok=0; echo "chunk $i incomplete: $HAVE/$WANT"; }
          done
          [ "$ok" = 1 ] || { echo "::error::分段下载未收敛"; exit 1; }
          ZIPFINAL="$ART_DIR/image-${{ inputs.image }}.zip"
          rm -f "$ZIPFINAL"
          for i in $(seq 0 $((N-1))); do
            [ -f "$ART_DIR/part_$i" ] && cat "$ART_DIR/part_$i" >> "$ZIPFINAL"
          done
          ls -lh "$ZIPFINAL"
          HAVE=$(stat -c%s "$ZIPFINAL")
          [ "$HAVE" = "$TOTAL" ] || { echo "::error::拼接后大小不符 have=$HAVE want=$TOTAL"; exit 1; }
          unzip -o -q "$ZIPFINAL" -d art
          TARBALL=$(ls art/*.tar.gz art/*.tar 2>/dev/null | head -n1)
          [ -n "$TARBALL" ] || { echo "::error::工件里没有 tar"; exit 1; }
          # 流式灌进宿主机 docker（docker load 兼容 gzip 流，不落盘）
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" \
            "${{ secrets.DEPLOY_USER }}"@"${{ secrets.DEPLOY_HOST }}" "docker load" \
            < "$TARBALL"
          # 清理持久卷里的分段与成品，防止跨次累积占满
          rm -rf /home/runner/.npm/art-partial
          echo "ARTIFACT_LOAD_OK"

      - name: 滚动更新容器
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}"@"${{ secrets.DEPLOY_HOST }}" '
            cd /data/docker/playwright-user-sys/docker || exit 1
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
          '

      - name: 健康检查（manager + gRPC 机器数）
        run: |
          sleep 20
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}"@"${{ secrets.DEPLOY_HOST }}" '
            for i in 1 2 3 4 5 6; do
              HEALTH=$(curl -sf http://localhost:3011/health || true)
              if echo "$HEALTH" | grep -q "\"status\":\"ok\""; then
                MACHINES=$(echo "$HEALTH" | grep -o "\"machines\":[0-9]*" | cut -d: -f2)
                echo "health=ok machines=$MACHINES"
                if [ "${MACHINES:-0}" -ge 1 ]; then
                  echo "DEPLOY_HEALTHY"; exit 0
                fi
              fi
              echo "attempt $i: not healthy yet, retry in 10s"
              sleep 10
            done
            echo "::error::部署后健康检查未通过（manager 异常或 gRPC 无机器连接），请查 docker logs playwright-manager-prod"
            exit 1
          '

      - name: 显示当前运行版本
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}"@"${{ secrets.DEPLOY_HOST }}" '
            docker ps --format "{{.Names}}\t{{.Image}}\t{{.Status}}" | grep playwright | sort
          '

  feishu-notify:
    name: Feishu Notification
    needs: [deploy]
    if: ${{ always() }}
    uses: dyyz1993/ci-tools/.github/workflows/feishu-notify.yml@main
    with:
      jobs: '{"deploy":"${{ needs.deploy.result }}"}'
      sha: ${{ github.sha }}
      ref: ${{ github.ref_name }}
      actor: ${{ github.actor }}
      repo: ${{ github.repository }}
      run-id: ${{ github.run_id }}
    secrets: inherit
