name: Docker Build & Test

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: docker/manager/Dockerfile.prod
            image_suffix: manager
            target: production
          - dockerfile: docker/machine/Dockerfile.prod
            image_suffix: machine
            target: production
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.image_suffix }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  test-manager:
    runs-on: ubuntu-latest
    needs: build
    if: always() && needs.build.result == 'success'
    
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and test manager image
        run: |
          echo "═══════════════════════════════════════"
          echo "  🧪 测试 Manager Docker 镜像"
          echo "═══════════════════════════════════════"
          
          # Pull image
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-manager:latest
          echo "✅ 镜像拉取成功"
          
          # Check image size
          IMAGE_SIZE=$(docker images ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-manager:latest --format "{{.Size}}")
          echo "📦 镜像大小: ${IMAGE_SIZE}"
          
          # Start container with required env vars
          docker run -d --name manager-test \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e HOST=0.0.0.0 \
            -e DB_TYPE=sqlite \
            -e DB_PATH=/app/data/test.sqlite \
            -e JWT_SECRET=test-secret-key-for-docker-health-check-min-32ch \
            -e JWT_EXPIRES_IN=24h \
            -e ADMIN_USERNAME=admin \
            -e ADMIN_PASSWORD=test_admin_password \
            -p 3000:3000 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-manager:latest
          
          echo "🚀 容器已启动，等待健康检查..."
          
          # Wait for health check with retries
          MAX_RETRIES=30
          for i in $(seq 1 $MAX_RETRIES); do
            if docker exec manager-test node -e "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" 2>/dev/null; then
              echo "✅ Manager 健康检查通过 (第 ${i} 次尝试)"
              break
            fi
            
            if [ $i -eq $MAX_RETRIES ]; then
              echo "❌ Manager 健康检查超时 (${MAX_RETRIES} 次尝试)"
              echo ""
              echo "📋 容器日志:"
              docker logs manager-test 2>&1 | tail -30
              docker rm -f manager-test 2>/dev/null || true
              exit 1
            fi
            
            echo "   等待中... (${i}/${MAX_RETRIES})"
            sleep 2
          done
          
          # Test basic API
          echo ""
          echo "📡 测试 API 端点..."
          
          # Test health endpoint
          HEALTH=$(curl -s http://localhost:3000/health || echo "FAILED")
          echo "   /health → ${HEALTH}"
          
          # Test login page
          LOGIN_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/admin/login || echo "000")
          echo "   /admin/login → HTTP ${LOGIN_STATUS}"
          
          # Cleanup
          echo ""
          echo "🧹 清理容器..."
          docker rm -f manager-test 2>/dev/null || true
          echo ""
          echo "✅ Manager Docker 镜像测试通过"

  test-machine:
    runs-on: ubuntu-latest
    needs: build
    if: always() && needs.build.result == 'success'
    
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and test machine image
        run: |
          echo "═══════════════════════════════════════"
          echo "  🧪 测试 Machine Docker 镜像"
          echo "═══════════════════════════════════════"
          
          # Pull image
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-machine:latest
          echo "✅ 镜像拉取成功"
          
          # Check image size
          IMAGE_SIZE=$(docker images ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-machine:latest --format "{{.Size}}")
          echo "📦 镜像大小: ${IMAGE_SIZE}"
          
          # Machine needs Chrome - create a dummy chrome for testing
          mkdir -p ./test-chrome
          cat > ./test-chrome/chromium << 'EOF'
          #!/bin/sh
          echo "Chrome test binary"
          exit 0
          EOF
          chmod +x ./test-chrome/chromium
          
          # Start container
          docker run -d --name machine-test \
            -e NODE_ENV=production \
            -e MACHINE_ID=test-machine-1 \
            -e MACHINE_NAME="Test Machine" \
            -e MANAGER_HOST=host.docker.internal:50051 \
            -e MACHINE_GRPC_PORT=50052 \
            -e PROXY_PORT=8082 \
            -v $(pwd)/test-chrome:/opt/google/chrome:ro \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-machine:latest || true
          
          echo "🚀 容器已启动，等待启动完成..."
          sleep 15
          
          # Check container status
          STATUS=$(docker inspect -f '{{.State.Status}}' machine-test 2>/dev/null || echo "not_found")
          echo "📋 容器状态: ${STATUS}"
          
          # Show logs
          echo ""
          echo "📋 容器日志:"
          docker logs machine-test 2>&1 | tail -20
          
          # Machine service is expected to crash without a real manager
          # But we verify the image boots and attempts to connect
          if echo "$STATUS" | grep -q "running\|exited"; then
            echo ""
            echo "✅ Machine Docker 镜像启动正常（无 Manager 连接为预期行为）"
          else
            echo ""
            echo "⚠️ Machine 容器状态异常: ${STATUS}"
          fi
          
          # Cleanup
          docker rm -f machine-test 2>/dev/null || true
          rm -rf ./test-chrome

  docker-summary:
    needs: [build, test-manager, test-machine]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Check results
        run: |
          echo "═══════════════════════════════════════"
          echo "  📊 Docker 构建测试总结"
          echo "═══════════════════════════════════════"
          echo ""
          echo "  Build:       ${{ needs.build.result }}"
          echo "  Test Manager: ${{ needs.test-manager.result }}"
          echo "  Test Machine: ${{ needs.test-machine.result }}"
          echo ""
          if [ "${{ needs.build.result }}" == "failure" ] || \
             [ "${{ needs.test-manager.result }}" == "failure" ]; then
            echo "❌ Docker 测试失败"
            exit 1
          fi
          echo "✅ Docker 构建测试通过"

  feishu-notify:
    name: Feishu Notification
    if: always()
    needs: [build, test-manager, test-machine, docker-summary]
    uses: dyyz1993/ci-tools/.github/workflows/feishu-notify.yml@main
    with:
      jobs: '{"build":"${{ needs.build.result }}","test-manager":"${{ needs.test-manager.result }}","test-machine":"${{ needs.test-machine.result }}","docker-summary":"${{ needs.docker-summary.result }}"}'
      sha: ${{ github.sha }}
      ref: ${{ github.ref_name }}
      actor: ${{ github.actor }}
      repo: ${{ github.repository }}
      run-id: ${{ github.run_id }}
    secrets:
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
