name: E2E Smoke Test

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: |
          docker buildx build \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -f docker/manager/Dockerfile.prod \
            -t playwright-manager:e2e \
            --target production --load .
          docker buildx build \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -f docker/machine/Dockerfile.prod \
            -t playwright-machine:e2e \
            --target e2e --load .

      - name: Start E2E environment
        run: |
          docker compose -f docker/docker-compose.e2e.yml up -d

          echo "Waiting for all services to become healthy..."
          timeout 180 bash -c '
            SERVICE_COUNT=$(docker compose -f docker/docker-compose.e2e.yml ps --services | wc -l)
            until [ "$(docker compose -f docker/docker-compose.e2e.yml ps | grep -c "(healthy)")" -eq "$SERVICE_COUNT" ]; do
              sleep 5
              echo "  Still waiting..."
              docker compose -f docker/docker-compose.e2e.yml ps
            done
          ' || {
            echo "=== Services did not become healthy in time ==="
            docker compose -f docker/docker-compose.e2e.yml ps
            echo "=== Manager logs ==="
            docker compose -f docker/docker-compose.e2e.yml logs manager 2>&1 | tail -50
            echo "=== Machine logs ==="
            docker compose -f docker/docker-compose.e2e.yml logs machine 2>&1 | tail -50
            exit 1
          }

          echo "All services healthy!"
          docker compose -f docker/docker-compose.e2e.yml ps

      - name: Wait for machine registration
        run: |
          echo "Checking manager health..."
          curl -sf http://localhost:3000/health | python3 -m json.tool
          echo ""
          echo "Checking machine health..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9100/health 2>/dev/null | python3 -m json.tool; then
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Machine health check failed after 30 retries"
              docker compose -f docker/docker-compose.e2e.yml logs machine 2>&1 | tail -50
              exit 1
            fi
            echo "  Machine not ready yet, retrying in 5s... ($i/30)"
            sleep 5
          done
          echo ""
          echo "Waiting 15s for gRPC registration..."
          sleep 15

      - name: Run E2E Smoke Test
        run: |
          BASE_URL=http://localhost:3000 \
          ADMIN_USERNAME=admin \
          ADMIN_PASSWORD=admin123 \
          npx tsx scripts/e2e-smoke-test.ts

      - name: Run Deployment Acceptance Test
        if: success()
        run: |
          BASE_URL=http://localhost:3000 \
          ADMIN_USERNAME=admin \
          ADMIN_PASSWORD=admin123 \
          TIMEOUT=120000 \
          npx tsx scripts/e2e-acceptance-test.ts

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Manager Logs ==="
          docker compose -f docker/docker-compose.e2e.yml logs manager 2>&1 | tail -80
          echo ""
          echo "=== Machine Logs ==="
          docker compose -f docker/docker-compose.e2e.yml logs machine 2>&1 | tail -80

      - name: Cleanup
        if: always()
        run: docker compose -f docker/docker-compose.e2e.yml down -v

  feishu-notify:
    name: Feishu Notification
    needs: [e2e-test]
    if: always()
    uses: dyyz1993/ci-tools/.github/workflows/feishu-notify.yml@main
    with:
      jobs: '{"e2e-test":"${{ needs.e2e-test.result }}"}'
      sha: ${{ github.sha }}
      ref: ${{ github.ref_name }}
      actor: ${{ github.actor }}
      repo: ${{ github.repository }}
      run-id: ${{ github.run_id }}
    secrets: inherit
