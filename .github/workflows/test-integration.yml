name: Integration Tests

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: playwright_test_user_sys
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    strategy:
      fail-fast: false
      matrix:
        include:
          - test-name: session-lifecycle
            test-file: tests/integration/session-lifecycle.test.ts
          - test-name: billing-flow
            test-file: tests/integration/billing-flow.test.ts
          - test-name: three-tier
            test-file: tests/integration/three-tier-architecture.test.ts
          - test-name: browser-params
            test-file: tests/integration/browser-parameters.test.ts
          - test-name: user-data
            test-file: tests/integration/user-data-persistence.test.ts
          - test-name: multi-user
            test-file: tests/integration/multi-user-concurrency.test.ts
          - test-name: security
            test-file: tests/integration/security-vulnerabilities.test.ts
          - test-name: fingerprint
            test-file: tests/integration/fingerprint-isolation-tier.test.ts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Setup Chrome
        uses: ./.github/actions/setup-chrome

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u root -ptest_password --silent; then
              echo "MySQL is ready"
              exit 0
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done
          echo "MySQL failed to start"
          exit 1

      - name: Setup test database
        env:
          MYSQL_PWD: test_password
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -e "CREATE DATABASE IF NOT EXISTS playwright_test_user_sys;"

      - name: Build project
        run: pnpm build

      - name: Run ${{ matrix.test-name }}
        env:
          TZ: UTC
          NODE_ENV: test
          PORT: 3000
          HOST: 127.0.0.1
          DB_TYPE: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: playwright_test_user_sys
          DB_USER: root
          DB_PASSWORD: test_password
          JWT_SECRET: test_secret_key_for_testing_only_do_not_use_in_production
          JWT_EXPIRES_IN: 24h
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: REDACTED_ADMIN_PASS
          INSTANCE_TIMEOUT: 60000
          GRPC_PORT: 50051
          PROXY_PORT: 8082
          MACHINE_MONITOR_INTERVAL: 30000
        run: |
          NODE_OPTIONS="--max-old-space-size=4096" npx vitest run ${{ matrix.test-file }} --reporter=verbose --no-coverage

  test-summary:
    needs: test-integration
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test-integration.result }}" == "failure" ]; then
            echo "❌ Some integration tests failed"
            echo "Please check the logs above for details"
            exit 1
          elif [ "${{ needs.test-integration.result }}" == "success" ]; then
            echo "✅ All integration tests passed"
            exit 0
          else
            echo "⚠️ Tests were cancelled or skipped"
            exit 1
          fi

  feishu-notify:
    name: Feishu Notification
    if: ${{ always() }}
    needs: [test-integration, test-summary]
    uses: dyyz1993/ci-tools/.github/workflows/feishu-notify.yml@main
    with:
      jobs: '{"test-integration":"${{ needs.test-integration.result }}","test-summary":"${{ needs.test-summary.result }}"}'
      sha: ${{ github.sha }}
      ref: ${{ github.ref_name }}
      actor: ${{ github.actor }}
      repo: ${{ github.repository }}
      run-id: ${{ github.run_id }}
    secrets:
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
