name: Security Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  test-security:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: playwright_test_user_sys
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm@10.8.0

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Chrome
        run: |
          # 检查是否已安装 Chrome
          if ! command -v google-chrome-stable &> /dev/null; then
            echo "Installing Google Chrome..."
            wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
            sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list'
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
            google-chrome-stable --version
          else
            echo "Chrome already installed"
            google-chrome-stable --version
          fi

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u root -ptest_password --silent; then
              echo "MySQL is ready"
              exit 0
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done
          echo "MySQL failed to start"
          exit 1

      - name: Setup test database
        env:
          MYSQL_PWD: test_password
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -e "CREATE DATABASE IF NOT EXISTS playwright_test_user_sys;"

      - name: Build project
        run: pnpm build

      - name: Run Security Vulnerability Tests
        env:
          TZ: UTC
          NODE_ENV: test
          PORT: 3000
          HOST: 127.0.0.1
          # 数据库配置
          DB_TYPE: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: playwright_test_user_sys
          DB_USER: root
          DB_PASSWORD: test_password
          # JWT 配置
          JWT_SECRET: test_secret_key_for_testing_only_do_not_use_in_production
          JWT_EXPIRES_IN: 24h
          # 管理员配置
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: REDACTED_ADMIN_PASS
          # 实例配置
          INSTANCE_TIMEOUT: 60000
          # gRPC 服务器配置
          GRPC_PORT: 50051
          # 代理服务器配置
          PROXY_PORT: 8082
        run: |
          NODE_OPTIONS="--max-old-space-size=4096" npx vitest run tests/integration/security-vulnerabilities.test.ts --reporter=verbose --no-coverage
