# Cookie 过期重定向测试
cookie_expiry_test:
  description: "清除 cookie 后访问 /admin/* 页面，验证重定向到登录页"
  steps:
    - action: cookies_clear
      description: "清除所有 cookies"
    - action: navigate
      url: "http://192.168.0.29:3011/admin/users"
  expected_result: "重定向到 /admin/login（渲染登录页面，不是 JSON 错误）"
  verification:
    - check_url: "http://192.168.0.29:3011/admin/login"
    - check_element: "#username"

# 浏览器登录绕过方法（因 Cookie Secure 标志限制）
browser_login_workaround:
  description: "通过 curl 获取 token 然后通过 eval 注入浏览器 cookie（绕过 Secure 标志问题）"
  steps:
    - action: curl
      command: 'TOKEN=$(curl -s -D - -o /dev/null -X POST "http://192.168.0.29:3011/admin/login" -H "Content-Type: application/x-www-form-urlencoded" -d "username=admin&password=admin123" 2>&1 | grep -o "token=[^;]*" | head -1 | sed "s/token=//") && echo $TOKEN'
      description: "通过 curl 获取登录 token"
    - action: eval
      selector: "javascript"
      value: "document.cookie = 'token=$TOKEN; path=/; max-age=604800; SameSite=Lax';"
      description: "通过 document.cookie 注入 token（不带 Secure 标志）"
    - action: open
      url: "http://192.168.0.29:3011/admin"
      description: "导航到仪表盘"
  note: "必须通过 document.cookie 注入，不能用 Playwright cookies set（会被设为 Secure）"
  note2: "根本原因是 Cookie 的 Secure 标志在 HTTP 下阻止浏览器存储 cookie"

tips:
  - "⚠️ COOKIE SECURE BUG: 服务器以 production 模式运行时 Cookie 设置 Secure 标志，但使用 HTTP 协议导致浏览器无法存储 cookie"
  - "⚠️ 根本原因: src/routes/admin.routes.ts:64 secure: process.env.NODE_ENV === 'production' 和 src/plugins/index.ts:110 同样的设置"
  - "⚠️ 修复方案: (1) 使用 HTTPS (2) 或修改 secure 判断逻辑为检测实际协议 (3) 或在 HTTP 环境下设置 NODE_ENV=development"
