# Module: admin-backend
# Reusable operation sequences

# 登录流程（来自 auth 模块）
login_flow:
  description: "管理后台登录流程"
  steps:
    - action: fill
      selector: "#username"
      value: "admin"
      description: "填写用户名"
    - action: fill
      selector: "#password"
      value: "admin123"
      description: "填写密码"
    - action: click
      selector: "button[type='submit']"
      description: "点击登录按钮"
  wait_after_submit: 2000
  expected_result: "跳转到仪表盘页面 /admin"

