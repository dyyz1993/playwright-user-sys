demo_page:
  url: "http://192.168.0.29:3011/demo"
  start_button: "#start-btn"
  title: "远程浏览器体验 - Playwright Browser Cloud"

session_ui:
  url_bar: "#url-input"
  quick_link_test: "button:nth-child(1)"  # 测试页面
  quick_link_baidu: "button:nth-child(2)"  # 百度
  quick_link_bing: "button:nth-child(3)"   # Bing
  quick_link_example: "button:nth-child(4)" # Example
  quick_link_slider: "button:nth-child(5)"  # 滑块验证
  end_button: "#btn-end"
  screenshot_button: "#btn-screenshot"
  upload_button: "#btn-upload"
  url_download_button: "#btn-url-download"

viewer_iframe:
  selector: "iframe#browser-viewer-frame"
  # The demo page embeds browser-viewer via iframe
  # Access via: document.getElementById('browser-viewer-frame').contentWindow.BrowserViewer.instance
  frame_name: "browser-viewer-frame"
  frame_url_pattern: "/browser-viewer/index.html?sessionId={sessionId}&token={token}"

  # Inside the viewer iframe:
  bv_screen: "#bv-screen"  # img element showing remote browser frames (blob URL)
  bv_status: "#bv-status"  # Status text like "已连接 · 14 FPS · 280 KB/s"

  # BrowserViewer.instance properties:
  # - sessionId: string
  # - token: string
  # - eventsWs: WebSocket (readyState 1 = open)
  # - streamWs: WebSocket (readyState 1 = open)
  # - img: HTMLImageElement (naturalWidth=1280, naturalHeight=800)
  # - connected: boolean
  # - frameCount: number
  #
  # BrowserViewer.instance methods:
  # - send({ type: 'event', event: { type: '...', data: { x, y, button? } } })
  # - navigateTo(url)
  # - connect()

slider_test_page:
  url: "http://192.168.0.29:3011/public/slider-test.html"
  # Remote browser viewport: 1280x800
  # Content centered in 600px max-width → content starts at x≈340, ends at x≈940
  # Container padding: 24px → track starts at x≈364, ends at x≈916
  
  # Slider section coordinates (at page top, no scroll):
  slider_track: "#sliderTrack"
  slider_thumb: "#sliderThumb"
  slider_fill: "#sliderFill"
  slider_result: "#sliderResult"
  slider_reset: ".slider-reset"
  
  # Approximate Y positions (page top, 1280x800 viewport):
  # - Title: y ≈ 70
  # - Slider track center: y ≈ 175-188
  # - Slider thumb (start): x ≈ 389, y ≈ 188
  # - Slider thumb (end): x ≈ 880, y ≈ 188
  
  # Sort section coordinates (after scroll down 200px):
  # - Item 1 (苹果): y ≈ 620
  # - Item 2 (香蕉): y ≈ 660
  # - Item 3 (樱桃): y ≈ 700
  # - Item 4 (葡萄): y ≈ 740
  # - Item 5 (橙子): y ≈ 780
  # Items are centered → x center ≈ 500-640

  # Upload section coordinates (at page top):
  # - Upload area center: x ≈ 640, y ≈ 430
