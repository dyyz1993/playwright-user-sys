# Module: gesture-mobile
# Reusable operation sequences

create_demo_session_and_open_viewer:
  description: "Create a demo session via API and open viewer with mobile UA"
  steps:
    - action: curl
      command: 'curl -s -X POST "http://192.168.0.29:3011/api/demo/session" -H "Content-Type: application/json"'
      description: "Create demo session via API"
      output: '{"success":true,"data":{"sessionId":"...","demoApiKey":"...","expiresAt":"...","maxDuration":300}}'
    - action: open
      url: "http://192.168.0.29:3011/browser-viewer/index.html?sessionId={sessionId}&token={demoApiKey}"
      user_agent: "Mozilla/5.0 (iPhone; CPU iPhone OS 16_0 like Mac OS X) AppleWebKit/605.1.15"
      description: "Open viewer with mobile UA to trigger mobile mode"
  expected_result: "Viewer loads in mobile mode with bottom toolbar (6 buttons) and top status bar"
  wait_after_open: 8000
  verification:
    - check: "window.BrowserViewer.instance.cursorOffset === 40"
    - check: "document.querySelectorAll('button[title]').length >= 4"

tap_gesture_test:
  description: "Test tap gesture (light touch → click)"
  steps:
    - action: eval
      code: |
        window.__sent = [];
        var viewer = window.BrowserViewer.instance;
        var origSend = viewer.send;
        viewer.send = function(msg) { window.__sent.push(JSON.parse(JSON.stringify(msg))); return origSend.call(viewer, msg); };
    - action: eval
      code: |
        var wrapper = document.getElementById('bv-wrapper');
        wrapper.dispatchEvent(new TouchEvent('touchstart', { touches: [new Touch({identifier:0,target:wrapper,clientX:640,clientY:365})], cancelable:true, bubbles:true }));
        wrapper.dispatchEvent(new TouchEvent('touchend', { changedTouches: [new Touch({identifier:0,target:wrapper,clientX:640,clientY:365})], cancelable:true, bubbles:true }));
    - action: verify
      check: "window.__sent.some(m => m.event && m.event.type === 'click' && m.event.data.clickCount === 1)"
  expected_result: "Sends click event with clickCount:1"

drag_gesture_test:
  description: "Test drag gesture (long press >800ms → drag → release)"
  steps:
    - action: eval
      code: |
        window.__sent = [];
        // Reinstall spy (must use window.__sent directly in closure)
        var viewer = window.BrowserViewer.instance;
        var origSend = window.__origSend || viewer.send;
        viewer.send = function(msg) { window.__sent.push(JSON.parse(JSON.stringify(msg))); return origSend.call(viewer, msg); };
    - action: eval
      code: "wrapper.dispatchEvent(new TouchEvent('touchstart', {...}))"
    - action: wait
      duration: 900  # Wait for longPressTimer (>800ms)
    - action: eval
      code: |
        wrapper.dispatchEvent(new TouchEvent('touchmove', {...}));
        wrapper.dispatchEvent(new TouchEvent('touchend', {...}));
    - action: verify
      check: "mouseup sent && click NOT sent"
  expected_result: "Sends mousedown, mousemove, mouseup but NO click"

chinese_input_test:
  description: "Test IME composition (compositionstart → compositionend)"
  steps:
    - action: eval
      code: |
        var hiddenInput = window.BrowserViewer.instance.hiddenInput;
        hiddenInput.dispatchEvent(new CompositionEvent('compositionstart', {data:''}));
        hiddenInput.value = 'zhong';
        hiddenInput.dispatchEvent(new CompositionEvent('compositionupdate', {data:'zhong'}));
        hiddenInput.dispatchEvent(new CompositionEvent('compositionend', {data:'中'}));
    - action: verify
      check: "hiddenInput.value === '' && sent input event with value '中'"
  expected_result: "hiddenInput cleared, sends {type:'input', data:{value:'中'}}"

tips:
  - "Mobile detection: isMobile = UA regex match OR window.innerWidth < 768"
  - "Touch target: touchTarget = self._wrapper (when cursorOffset > 0), else img"
  - "cursorOffset = 40 on mobile (detected by UA regex)"
  - "Spy setup: Use window.__sent directly in closure to avoid stale references"
  - "API field names: data.sessionId (not data.id), data.demoApiKey (not data.token)"
  - "Clipboard API requires secure context (HTTPS) - mock it for testing on HTTP"
  - "Viewer instance: window.BrowserViewer.instance (set in index.html inline script)"
  - "File manager modal: no specific ID, detected by fixed position + zIndex > 99999"
  - "Demo session expires in 5 minutes (maxDuration: 300)"
