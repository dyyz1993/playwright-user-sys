# Module: gesture-mobile
# Site: http://192.168.0.29:3011
# Version: 1
# Status: verified
# Last verified: 2026-05-15
# Verified in round: r1

demo_page:
  url: "http://192.168.0.29:3011/demo"
  start_button: "button"  # Text: "开始体验"

viewer_page:
  url_pattern: "/browser-viewer/index.html?sessionId={sessionId}&token={token}"
  viewer_instance: "window.BrowserViewer.instance"
  wrapper: "#bv-wrapper"
  screen_img: "#bv-screen"
  viewport: "#bv-viewport"
  tab_bar: "#bv-tab-bar"
  status: "#bv-status"
  hidden_input: "textarea"  # hiddenInput for text/IME input

mobile_toolbar:
  bottom_bar_buttons:
    back: "button[title='']"  # ← button
    forward: "button"  # → button  
    home: "button"  # 🏠 button
    upload: "button[title='上传文件']"  # 📁 button
    copy: "button[title='复制到本地']"  # 📋 button
    paste: "button[title='粘贴到远程']"  # 📎 button
  top_bar:
    back_to_demo: "a[href='/demo']"  # "返回 Demo" link
  desktop_buttons_hidden: true  # ⌨📁📎📋 desktop floating buttons are hidden on mobile

api:
  create_demo_session:
    method: POST
    url: "http://192.168.0.29:3011/api/demo/session"
    response_fields:
      session_id: "data.sessionId"
      token: "data.demoApiKey"
      expires_at: "data.expiresAt"
