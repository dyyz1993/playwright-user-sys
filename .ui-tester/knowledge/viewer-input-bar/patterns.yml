# Module: viewer-input-bar
# Proven interaction patterns for the viewer input bar feature

login_and_create_session:
  description: "Login and create a browser session for viewer testing"
  steps:
    - action: curl
      endpoint: "POST /api/auth/login"
      body: '{"username":"admin","password":"admin123"}'
      description: "Login to get JWT token"
    - action: curl
      endpoint: "POST /api/sessions"
      headers: "Authorization: Bearer {token}"
      body: '{"name":"test-session"}'
      description: "Create browser session, get sessionId"
    - action: construct_url
      pattern: "/viewer?sessionId={sessionId}&token={token}"
      description: "Build viewer URL with session ID and token"
  expected_result: "Viewer URL with valid session"

connect_viewer_with_auth:
  description: "Open viewer and connect WebSockets with authentication"
  critical_note: "The viewer HTML does NOT pass token in WS URL by default. Must inject fix."
  bug: "viewer connectWebSockets() creates WS URLs without token param, causing 401 auth failure"
  fix: |
    // Inject after page load:
    const token = getUrlParam('token');
    const eventsUrl = 'ws://' + window.location.host + '/ws/' + sessionId + '/events?token=' + encodeURIComponent(token);
    const videoUrl = 'ws://' + window.location.host + '/ws/' + sessionId + '/stream?token=' + encodeURIComponent(token);
    // Reconnect with token...
  steps:
    - action: open_browser
      viewport: "393x852"
      user_agent: "iPhone Safari Mobile"
      description: "Open viewer with mobile viewport"
    - action: inject_js
      code: "Reconnect WS with token in URL params"
      description: "Fix WS auth by adding ?token= to WS URL"
    - action: wait
      ms: 3000
      description: "Wait for WS connection"
  expected_result: "Both WS connections state=1 (OPEN)"
  wait_after: 3000

navigate_remote_page:
  description: "Navigate the remote browser to a specific URL"
  critical_note: "The viewer's sendEvent() puts data in wrong format for server. Use sendEventFixed()."
  bug: "sendEvent() puts x,y in event root, but server reads from event.data"
  fix: |
    // Fixed sendEvent:
    window.sendEventFixed = function(type, data) {
      eventsSocket.send(JSON.stringify({
        type: 'event',
        event: { type: type, timestamp: Date.now(), data: data }
      }));
    };
  steps:
    - action: inject_js
      code: "window.sendEventFixed('navigate', {url: 'http://192.168.0.29:3011/test-interactive.html'})"
      description: "Navigate remote browser to test page"
    - action: wait
      ms: 5000
      description: "Wait for page load and frames"
  expected_result: "Remote page visible in viewer"

click_remote_input:
  description: "Click on an input field in the remote browser to focus it"
  critical_note: "Must use sendEventFixed(), not sendEvent(). Coordinates are in remote page space (1280x800)."
  coordinate_tips:
    - "Remote page is 1280x800, body max-width 600px centered, content starts at x=340"
    - "First text input '请输入文字...' is at approximately (370, 385)"
    - "Click counter increments on every click (document-level listener)"
  steps:
    - action: inject_js
      code: "window.sendEventFixed('mouseClick', {x: 370, y: 385, button: 'left'})"
      description: "Click on first text input field"
    - action: wait
      ms: 3000
      description: "Wait for form.field event (currently broken)"
  expected_result: "Input field gets blue focus ring on remote page"

input_text_via_keyboard_modal:
  description: "Type text via the keyboard modal and sync to remote"
  critical_note: "form.field event NOT sent from server to viewer (possible init script issue)"
  workaround: "Manually show keyboard modal and set focusedElement"
  steps:
    - action: inject_js
      code: |
        focusedElement = { selector: 'input[type="text"]', tag: 'input' };
        showKeyboardModal();
        keyboardInput.value = 'test text';
        keyboardInput.focus();
      description: "Manually show keyboard modal and set focused element"
    - action: inject_js
      code: |
        window.submitKeyboardInputFixed = function() {
          const text = keyboardInput.value;
          if (text && focusedElement) {
            window.sendEventFixed('input', { value: text, selector: focusedElement.selector });
            keyboardInput.value = '';
            hideKeyboardModal();
          }
        };
        window.submitKeyboardInputFixed();
      description: "Submit text to remote browser via fixed event format"
    - action: wait
      ms: 2000
      description: "Wait for text to sync to remote"
  expected_result: "Text appears in remote input field"

tips:
  - "CRITICAL BUG: Viewer WS URLs don't include auth token, causing immediate close (code 1006)"
  - "CRITICAL BUG: sendEvent() formats data incorrectly - server reads event.data but viewer puts coords in event root"
  - "CRITICAL BUG: form.field event not received by viewer when remote input is focused (init script/bridge issue)"
  - "Workaround: Manually reconnect WS with token, use sendEventFixed(), manually trigger keyboard modal"
  - "Remote page body is max-width 600px centered on 1280px viewport, content starts at x=340"
  - "The click counter in test-interactive.html increments on ANY document click (not just buttons)"
