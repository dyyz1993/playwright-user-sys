# Module: viewer
# Reusable operation sequences

access_viewer_with_token:
  description: "Access viewer page with auth token in URL query param"
  steps:
    - action: open
      url: "http://192.168.0.29:3011/viewer?sessionId={sessionId}&token={jwtToken}"
      description: "Open viewer page with sessionId and token parameters"
  expected_result: "Page loads showing session information, status Active, machine name, duration"
  verification:
    - check_element: "#session-details"
    - check_element: "#connect-code"

access_viewer_without_token:
  description: "Access viewer page without auth token"
  steps:
    - action: open
      url: "http://192.168.0.29:3011/viewer?sessionId={sessionId}"
      description: "Open viewer page with only sessionId"
  expected_result: "HTTP 401 error - session API requires authentication"
  known_issue: true
  issue_detail: "Viewer page fetches /api/sessions/{id} without token when no cookie is set. The token param in URL is used by the viewer JS but cookie-based auth fails due to Secure flag bug."

create_session_via_api:
  description: "Create a session via API and get viewer URL"
  steps:
    - action: curl
      command: 'curl -s -X POST "http://192.168.0.29:3011/api/sessions" -H "Content-Type: application/json" -H "Authorization: Bearer $TOKEN" -d "{\"browserType\":\"chromium\",\"headless\":true}"'
      description: "Create session via API"
  expected_result: "Returns JSON with id, status, browserWSEndpoint, viewerUrl"
  output_fields:
    - "data.id" → sessionId
    - "data.viewerUrl" → viewer URL
    - "data.browserWSEndpoint" → WebSocket endpoint

view_session_from_admin:
  description: "Navigate to session detail from admin sessions page"
  steps:
    - action: open
      url: "http://192.168.0.29:3011/admin/sessions"
      description: "Open sessions management page"
    - action: click
      selector: "a[href*='viewer']"  # viewer link icon in session row
      description: "Click viewer link for the session"
  expected_result: "Navigates to session detail page showing full session info"

tips:
  - "⚠️ VIEWER AUTH BUG: Viewer page without token parameter shows HTTP 401 because cookie-based auth fails (Secure flag bug on HTTP)"
  - "✅ FIX: Include token in URL query param: /viewer?sessionId=xxx&token=JWT_TOKEN"
  - "Viewer page JS reads token from URL params: new URLSearchParams(window.location.search).get('token') || getCookie('token')"
  - "Session creation API returns viewerUrl but WITHOUT token - must manually append token"
  - "Session detail page (/admin/sessions/{id}) works fine because admin pages use cookie auth (via document.cookie injection workaround)"
  - "Quick create test session modal: user dropdown may fail to load users (only shows placeholder option)"
  - "Session detail page shows: ID, status, created time, start time, end time, duration, consumed points, proxy port, session options"
