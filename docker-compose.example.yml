version: '3.8'

services:
  # 管理服务器
  manager:
    image: ghcr.io/dyyz1993/playwright-user-sys:manager
    container_name: playwright-manager
    environment:
      - NODE_ENV=production
      - DATABASE_URL=sqlite:./data/database.sqlite
      - JWT_SECRET=your-secret-key
      - ADMIN_PASSWORD=REDACTED_ADMIN_PASS
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped

  # 实例机器
  machine:
    image: ghcr.io/dyyz1993/playwright-user-sys:machine
    container_name: playwright-machine
    environment:
      - NODE_ENV=production
      - MANAGEMENT_SERVER_URL=http://manager:3000
      - MANAGER_HOST=manager
      - HOST_IP=machine
    ports:
      - "8082:8082"
      - "50052:50052"
    volumes:
      # Chrome文件映射 - 必须提供包含chrome可执行文件的目录
      - ./chrome:/opt/chrome:ro
      - ./machine-data:/app/data
    depends_on:
      - manager
    restart: unless-stopped
    # 注意：如果Chrome目录不存在或没有chrome可执行文件，容器会启动失败

  # 简单实例（可选）
  simple:
    image: ghcr.io/dyyz1993/playwright-user-sys:simple
    container_name: playwright-simple
    environment:
      - NODE_ENV=production
      - MANAGEMENT_SERVER_URL=http://manager:3000
    ports:
      - "8083:8082"
    depends_on:
      - manager
    restart: unless-stopped

volumes:
  data:
  uploads:
  machine-data: