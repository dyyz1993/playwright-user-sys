version: '3.8'

services:
  # 管理服务器
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: playwright-user-sys
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DB_TYPE=sqlite
      - DB_PATH=/app/data/db.sqlite
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - JWT_EXPIRES_IN=1d
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-REDACTED_ADMIN_PASS}
      - INSTANCE_TIMEOUT=60000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - playwright-network

  # 实例机器 1
  machine1:
    build:
      context: .
      dockerfile: Dockerfile.machine
    container_name: playwright-machine-1
    restart: unless-stopped
    depends_on:
      - app
    environment:
      - NODE_ENV=production
      - MACHINE_ID=machine-1
      - MANAGEMENT_SERVER_URL=http://app:3000
      - STATUS_REPORT_INTERVAL=60000
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - playwright-network

  # 实例机器 2
  machine2:
    build:
      context: .
      dockerfile: Dockerfile.machine
    container_name: playwright-machine-2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      - NODE_ENV=production
      - MACHINE_ID=machine-2
      - MANAGEMENT_SERVER_URL=http://app:3000
      - STATUS_REPORT_INTERVAL=60000
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - playwright-network

  # 可选的 MySQL 服务
