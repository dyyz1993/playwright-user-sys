services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: playwright-user-sys:latest
    container_name: playwright-user-sys
    restart: unless-stopped
    ports:
      - "3011:3000"
      - "50051:50051"
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env.production
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DB_TYPE=${DB_TYPE:-sqlite}
      - DB_PATH=${DB_PATH:-/app/data/database.sqlite}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1d}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      - INSTANCE_TIMEOUT=${INSTANCE_TIMEOUT:-60000}
      - GRPC_PORT=50051
    depends_on:
      db:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  machine-1:
    build:
      context: .
      dockerfile: Dockerfile.machine
    image: playwright-machine:latest
    container_name: playwright-machine-1
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - MACHINE_ID=machine-1
      - MANAGEMENT_SERVER_URL=http://app:3000
      - STATUS_REPORT_INTERVAL=60000
      - MANAGER_HOST=app:50051
      - MACHINE_IP=${PUBLIC_IP:-127.0.0.1}
    volumes:
      - ./machine-data-1:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  machine-2:
    build:
      context: .
      dockerfile: Dockerfile.machine
    image: playwright-machine:latest
    container_name: playwright-machine-2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - MACHINE_ID=machine-2
      - MANAGEMENT_SERVER_URL=http://app:3000
      - STATUS_REPORT_INTERVAL=60000
      - MANAGER_HOST=app:50051
      - MACHINE_IP=${PUBLIC_IP:-127.0.0.1}
    volumes:
      - ./machine-data-2:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

