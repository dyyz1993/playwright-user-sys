version: '3.8'

services:
  # 管理服务器
  app:
    image: playwright-user-sys:latest
    container_name: playwright-user-sys
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "50051:50051"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DB_TYPE=sqlite
      - DB_PATH=/app/data/database.sqlite
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - JWT_EXPIRES_IN=1d
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-REDACTED_ADMIN_PASS}
      - INSTANCE_TIMEOUT=60000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 机器实例 1
  machine-1:
    image: playwright-machine:latest
    container_name: playwright-machine-1
    restart: unless-stopped
    depends_on:
      - app
    environment:
      - NODE_ENV=production
      - MACHINE_ID=machine-1
      - MANAGEMENT_SERVER_URL=http://app:3000
      - STATUS_REPORT_INTERVAL=60000
      - MANAGER_HOST=app:50051
      - MACHINE_IP=192.168.107.4
    volumes:
      - ./machine-data-1:/app/data

  # 机器实例 2
  machine-2:
    image: playwright-machine:latest
    container_name: playwright-machine-2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      - NODE_ENV=production
      - MACHINE_ID=machine-2
      - MANAGEMENT_SERVER_URL=http://app:3000
      - STATUS_REPORT_INTERVAL=60000
      - MANAGER_HOST=app:50051
      - MACHINE_IP=192.168.107.5
    volumes:
      - ./machine-data-2:/app/data

