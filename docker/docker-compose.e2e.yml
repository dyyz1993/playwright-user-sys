# Docker Compose for E2E Smoke Testing
# Self-contained: Manager (SQLite) + Machine (Playwright Chromium)
#
# Usage:
#   docker compose -f docker/docker-compose.e2e.yml up -d
#   BASE_URL=http://localhost:3000 npx tsx scripts/e2e-smoke-test.ts
#   docker compose -f docker/docker-compose.e2e.yml down -v

services:
  manager:
    image: playwright-manager:e2e
    build:
      context: ..
      dockerfile: docker/manager/Dockerfile.prod
      target: production
    container_name: playwright-e2e-manager
    ports:
      - "3000:3000"
      - "50051:50051"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DB_TYPE=sqlite
      - DB_PATH=/app/data/e2e-test.sqlite
      - JWT_SECRET=e2e-test-jwt-secret-key-min-32-characters
      - JWT_EXPIRES_IN=24h
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
      - GRPC_PORT=50051
      - CORS_ORIGINS=*
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  machine:
    image: playwright-machine:e2e
    build:
      context: ..
      dockerfile: docker/machine/Dockerfile.prod
      target: e2e
    container_name: playwright-e2e-machine
    depends_on:
      manager:
        condition: service_healthy
    ports:
      - "8082:8082"
      - "9100:9100"
    environment:
      - NODE_ENV=production
      - MACHINE_ID=e2e-machine-1
      - MACHINE_NAME=E2E Test Machine
      - MANAGER_HOST=manager:50051
      - MACHINE_GRPC_PORT=50052
      - PROXY_PORT=8082
      - MACHINE_HEALTH_PORT=9100
      - MAX_SESSIONS=5
      - SESSION_TIMEOUT=300000
      - DISPLAY=:99
      - CHROME_PATH=/usr/bin/google-chrome-stable
      - JWT_SECRET=e2e-test-jwt-secret-key-min-32-characters
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
