# Docker Compose for Production
# Usage: docker-compose -f docker-compose.prod.yml up -d

version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: playwright-mysql-prod
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-playwright_user_sys}
      MYSQL_USER: ${MYSQL_USER:-playwright}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-prod-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - playwright-prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Management Server
  manager:
    build:
      context: ..
      dockerfile: docker/manager/Dockerfile
      target: production
    image: playwright-manager:${IMAGE_TAG:-latest}
    container_name: playwright-manager-prod
    restart: always
    ports:
      - "${MANAGER_HTTP_PORT:-3000}:3000"
      - "${MANAGER_GRPC_PORT:-50051}:50051"
    volumes:
      - manager-prod-data:/app/data
      - manager-prod-files:/app/files
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DB_TYPE=mysql
      - DB_NAME=${MYSQL_DATABASE:-playwright_user_sys}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${MYSQL_USER:-playwright}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1d}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - GRPC_PORT=50051
      - MACHINE_MONITOR_INTERVAL=${MACHINE_MONITOR_INTERVAL:-30000}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - playwright-prod-network
    deploy:
      resources:
        limits:
          cpus: ${MANAGER_CPU_LIMIT:-2}
          memory: ${MANAGER_MEMORY_LIMIT:-2G}
        reservations:
          cpus: ${MANAGER_CPU_RESERVATION:-0.5}
          memory: ${MANAGER_MEMORY_RESERVATION:-512M}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Machine Service 1
  machine-1:
    build:
      context: ..
      dockerfile: docker/machine/Dockerfile
      target: production
    image: playwright-machine:${IMAGE_TAG:-latest}
    container_name: playwright-machine-1-prod
    restart: always
    ports:
      - "${MACHINE_1_GRPC_PORT:-50052}:50052"
      - "${MACHINE_1_PROXY_PORT:-8082}:8082"
    volumes:
      - machine-1-prod-data:/app/data
      - machine-1-prod-screenshots:/app/dist/data/screenshots
    environment:
      - NODE_ENV=production
      - MACHINE_ID=${MACHINE_1_ID:-machine-1}
      - MACHINE_NAME=${MACHINE_1_NAME:-Production Machine 1}
      - MANAGER_HOST=manager:50051
      - MACHINE_GRPC_PORT=50052
      - PROXY_PORT=8082
      - MAX_SESSIONS=${MAX_SESSIONS:-10}
      - SESSION_TIMEOUT=${SESSION_TIMEOUT:-300000}
      - HEARTBEAT_INTERVAL=${HEARTBEAT_INTERVAL:-30000}
    depends_on:
      manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8082/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - playwright-prod-network
    deploy:
      resources:
        limits:
          cpus: ${MACHINE_CPU_LIMIT:-4}
          memory: ${MACHINE_MEMORY_LIMIT:-4G}
        reservations:
          cpus: ${MACHINE_CPU_RESERVATION:-1}
          memory: ${MACHINE_MEMORY_RESERVATION:-1G}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Machine Service 2 (for horizontal scaling)
  machine-2:
    build:
      context: ..
      dockerfile: docker/machine/Dockerfile
      target: production
    image: playwright-machine:${IMAGE_TAG:-latest}
    container_name: playwright-machine-2-prod
    restart: always
    ports:
      - "${MACHINE_2_GRPC_PORT:-50053}:50052"
      - "${MACHINE_2_PROXY_PORT:-8083}:8082"
    volumes:
      - machine-2-prod-data:/app/data
      - machine-2-prod-screenshots:/app/dist/data/screenshots
    environment:
      - NODE_ENV=production
      - MACHINE_ID=${MACHINE_2_ID:-machine-2}
      - MACHINE_NAME=${MACHINE_2_NAME:-Production Machine 2}
      - MANAGER_HOST=manager:50051
      - MACHINE_GRPC_PORT=50052
      - PROXY_PORT=8082
      - MAX_SESSIONS=${MAX_SESSIONS:-10}
      - SESSION_TIMEOUT=${SESSION_TIMEOUT:-300000}
      - HEARTBEAT_INTERVAL=${HEARTBEAT_INTERVAL:-30000}
    depends_on:
      manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8082/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - playwright-prod-network
    deploy:
      resources:
        limits:
          cpus: ${MACHINE_CPU_LIMIT:-4}
          memory: ${MACHINE_MEMORY_LIMIT:-4G}
        reservations:
          cpus: ${MACHINE_CPU_RESERVATION:-1}
          memory: ${MACHINE_MEMORY_RESERVATION:-1G}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - scaling

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: playwright-nginx-prod
    restart: always
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - nginx-prod-logs:/var/log/nginx
    depends_on:
      - manager
    networks:
      - playwright-prod-network
    deploy:
      resources:
        limits:
          cpus: ${NGINX_CPU_LIMIT:-1}
          memory: ${NGINX_MEMORY_LIMIT:-512M}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - with-nginx

networks:
  playwright-prod-network:
    driver: bridge
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:-172.20.0.0/16}

volumes:
  mysql-prod-data:
    driver: local
  manager-prod-data:
    driver: local
  manager-prod-files:
    driver: local
  machine-1-prod-data:
    driver: local
  machine-1-prod-screenshots:
    driver: local
  machine-2-prod-data:
    driver: local
  machine-2-prod-screenshots:
    driver: local
  nginx-prod-logs:
    driver: local
