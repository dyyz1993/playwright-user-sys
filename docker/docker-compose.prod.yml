# Docker Compose for Production
# Usage: docker compose -f docker-compose.prod.yml up -d

version: '3.8'

services:
  # Management Server
  manager:
    restart: always
    build:
      context: ..
      dockerfile: docker/manager/Dockerfile.prod
      target: production
    image: playwright-manager:${IMAGE_TAG:-latest}
    container_name: playwright-manager-prod
    ports:
      - "3011:3000"
      - "50051:50051"
    volumes:
      - manager-prod-data:/app/data
      - manager-prod-files:/app/files
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DB_TYPE=mysql
      - DB_HOST=REDACTED_INTERNAL_HOST
      - DB_PORT=3307
      - DB_USER=playwright_user_sys
      - DB_PASSWORD=REDACTED_PASSWORD
      - DB_NAME=playwright_user_sys
      - JWT_SECRET=your-32-character-minimum-secret-key-for-jwt-and-session
      - JWT_EXPIRES_IN=1d
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=REDACTED_ADMIN_PASS
      - GRPC_PORT=50051
      - MACHINE_MONITOR_INTERVAL=30000
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Machine Service 1
  machine-1:
    build:
      context: ..
      dockerfile: docker/machine/Dockerfile.prod
      target: production
    image: playwright-machine:${IMAGE_TAG:-latest}
    container_name: playwright-machine-1-prod
    restart: always
    ports:
      - "50052:50052"
      - "8082:8082"
    volumes:
      - machine-1-prod-data:/app/data
      - machine-1-prod-screenshots:/app/dist/data/screenshots
      - /data/docker/cache/chromium:/opt/google/chrome:ro
    environment:
      - NODE_ENV=production
      - MACHINE_ID=machine-1
      - MACHINE_NAME="Production Machine 1"
      - MANAGER_HOST=manager:50051
      - MACHINE_GRPC_PORT=50052
      - PROXY_PORT=8082
      - MAX_SESSIONS=10
      - SESSION_TIMEOUT=300000
      - HEARTBEAT_INTERVAL=30000
      - CHROME_BIN=/opt/google/chrome/chromium
      - CHROME_PATH=/opt/google/chrome/chromium
      - PUPPETEER_EXECUTABLE_PATH=/opt/google/chrome/chromium
      - no_proxy=REDACTED_INTERNAL_HOST,localhost,127.0.0.1,manager,machine-1,machine-2
      - NO_PROXY=REDACTED_INTERNAL_HOST,localhost,127.0.0.1,manager,machine-1,machine-2
    depends_on:
      - manager
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Machine Service 2
  machine-2:
    build:
      context: ..
      dockerfile: docker/machine/Dockerfile.prod
      target: production
    image: playwright-machine:${IMAGE_TAG:-latest}
    container_name: playwright-machine-2-prod
    restart: always
    ports:
      - "50053:50053"
      - "8083:8083"
    volumes:
      - machine-2-prod-data:/app/data
      - machine-2-prod-screenshots:/app/dist/data/screenshots
      - /data/docker/cache/chromium:/opt/google/chrome:ro
    environment:
      - NODE_ENV=production
      - MACHINE_ID=machine-2
      - MACHINE_NAME="Production Machine 2"
      - MANAGER_HOST=manager:50051
      - MACHINE_GRPC_PORT=50053
      - PROXY_PORT=8083
      - MAX_SESSIONS=10
      - SESSION_TIMEOUT=300000
      - HEARTBEAT_INTERVAL=30000
      - CHROME_BIN=/opt/google/chrome/chromium
      - CHROME_PATH=/opt/google/chrome/chromium
      - PUPPETEER_EXECUTABLE_PATH=/opt/google/chrome/chromium
      - no_proxy=REDACTED_INTERNAL_HOST,localhost,127.0.0.1,manager,machine-1,machine-2
      - NO_PROXY=REDACTED_INTERNAL_HOST,localhost,127.0.0.1,manager,machine-1,machine-2
      - HTTP_PROXY=http://REDACTED_PROXY_HOST:7890
      - HTTPS_PROXY=http://REDACTED_PROXY_HOST:7890
      - ALL_PROXY=socks5://REDACTED_PROXY_HOST:7890
    depends_on:
      - manager
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  manager-prod-data:
  manager-prod-files:
  machine-1-prod-data:
  machine-1-prod-screenshots:
  machine-2-prod-data:
  machine-2-prod-screenshots:
