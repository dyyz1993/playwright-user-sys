# Docker Compose for Production
# Usage: docker compose -f docker-compose.prod.yml up -d
# Requires: .env file with required variables (see .env.example)

version: '3.8'

services:
  # Management Server
  manager:
    restart: always
    build:
      context: ..
      dockerfile: docker/manager/Dockerfile.prod
      target: production
      args:
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
        - NO_PROXY=${NO_PROXY}
    image: ${DOCKER_REGISTRY:-ghcr.io/dyyz1993/playwright-user-sys-manager}:${IMAGE_TAG:-latest}
    container_name: playwright-manager-prod
    ports:
      - "${MANAGER_HTTP_PORT:-3011}:3000"
      - "${MANAGER_GRPC_PORT:-50051}:50051"
    volumes:
      - manager-prod-data:/app/data
      - manager-prod-files:/app/files
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DB_TYPE=mysql
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - GRPC_PORT=50051
      - MACHINE_MONITOR_INTERVAL=${MACHINE_MONITOR_INTERVAL}
      - PUBLIC_MANAGER_URL=${PUBLIC_MANAGER_URL}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Machine Service 1
  machine-1:
    build:
      context: ..
      dockerfile: docker/machine/Dockerfile.prod
      target: production
      args:
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
        - NO_PROXY=${NO_PROXY}
    image: ${DOCKER_REGISTRY_MACHINE:-ghcr.io/dyyz1993/playwright-user-sys-machine}:${IMAGE_TAG:-latest}
    container_name: playwright-machine-1-prod
    restart: always
    ports:
      - "${MACHINE_1_GRPC_PORT:-50052}:50052"
      - "${MACHINE_1_PROXY_PORT:-8082}:8082"
    volumes:
      - machine-1-prod-data:/app/data
      - machine-1-prod-screenshots:/app/dist/data/screenshots
      - /data/docker/cache/chromium:/opt/google/chrome:ro
    environment:
      - NODE_ENV=production
      - MACHINE_ID=machine-1
      - MACHINE_NAME="Production Machine 1"
      - MANAGER_HOST=manager:50051
      - MACHINE_GRPC_PORT=50052
      - PROXY_PORT=8082
      - MAX_SESSIONS=${MAX_SESSIONS}
      - SESSION_TIMEOUT=${SESSION_TIMEOUT}
      - HEARTBEAT_INTERVAL=${HEARTBEAT_INTERVAL}
      - CHROME_BIN=/opt/google/chrome/chromium
      - CHROME_PATH=/opt/google/chrome/chromium
      - NO_PROXY=${NO_PROXY}
    depends_on:
      - manager
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Machine Service 2
  machine-2:
    build:
      context: ..
      dockerfile: docker/machine/Dockerfile.prod
      target: production
      args:
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
        - NO_PROXY=${NO_PROXY}
    image: ${DOCKER_REGISTRY_MACHINE:-ghcr.io/dyyz1993/playwright-user-sys-machine}:${IMAGE_TAG:-latest}
    container_name: playwright-machine-2-prod
    restart: always
    ports:
      - "${MACHINE_2_GRPC_PORT:-50053}:50053"
      - "${MACHINE_2_PROXY_PORT:-8083}:8083"
    volumes:
      - machine-2-prod-data:/app/data
      - machine-2-prod-screenshots:/app/dist/data/screenshots
      - /data/docker/cache/chromium:/opt/google/chrome:ro
    environment:
      - NODE_ENV=production
      - MACHINE_ID=machine-2
      - MACHINE_NAME="Production Machine 2"
      - MANAGER_HOST=manager:50051
      - MACHINE_GRPC_PORT=50053
      - PROXY_PORT=8083
      - MAX_SESSIONS=${MAX_SESSIONS}
      - SESSION_TIMEOUT=${SESSION_TIMEOUT}
      - HEARTBEAT_INTERVAL=${HEARTBEAT_INTERVAL}
      - CHROME_BIN=/opt/google/chrome/chromium
      - CHROME_PATH=/opt/google/chrome/chromium
      - NO_PROXY=${NO_PROXY}
    depends_on:
      - manager
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  manager-prod-data:
  manager-prod-files:
  machine-1-prod-data:
  machine-1-prod-screenshots:
  machine-2-prod-data:
  machine-2-prod-screenshots:
