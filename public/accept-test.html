<!DOCTYPE html>
<html>
<head><title>Accept Test</title></head>
<body style="padding:40px;font-family:sans-serif;">
<h1>Accept 限制测试</h1>
<p>下面是3个不同的 file input，各有不同的 accept:</p>
<hr>
<p><strong>1. 仅图片 (accept="image/*")</strong></p>
<input type="file" accept="image/*" id="img-input" style="font-size:20px;padding:10px;">
<p><strong>2. 仅 PDF (accept=".pdf")</strong></p>
<input type="file" accept=".pdf" id="pdf-input" style="font-size:20px;padding:10px;">
<p><strong>3. 无限制</strong></p>
<input type="file" id="any-input" style="font-size:20px;padding:10px;">
</body>
</html>
