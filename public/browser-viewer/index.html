<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>远程浏览器查看器</title>
  <link rel="stylesheet" href="browser-viewer.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #111; }
    #viewer-container { width: 100%; height: 100vh; }
  </style>
</head>
<body>
  <div id="viewer-container"></div>
  <script src="browser-viewer.js"></script>
  <script>
    var params = new URLSearchParams(window.location.search);
    var sessionId = params.get('sessionId');
    var wsHost = params.get('wsHost') || window.location.host;
    var token = params.get('token') || '';
    
    if (!sessionId) {
      document.getElementById('viewer-container').innerHTML =
        '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#9ca3af;font-family:system-ui;">' +
          '<div style="text-align:center">' +
            '<h2>远程浏览器查看器</h2>' +
            '<p style="margin-top:12px">请在 URL 中提供 sessionId 参数</p>' +
            '<p style="margin-top:8px;font-size:13px;color:#6b7280">' +
              '示例: /browser-viewer/index.html?sessionId=xxx&wsHost=192.168.0.29:3011' +
            '</p>' +
          '</div>' +
        '</div>';
    } else {
      var viewer = new BrowserViewer({
        containerId: 'viewer-container',
        sessionId: sessionId,
        wsHost: wsHost,
        token: token,
      });
      window.BrowserViewer = window.BrowserViewer || {};
      window.BrowserViewer.instance = viewer;
      viewer.mount().connect();
    }
  </script>
</body>
</html>
